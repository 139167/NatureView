name: macOS

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Render soundscape
        run: |
          ./build/soundscape_render --seed 139167 --seconds 60 \
            --duration 5 --output build/nature-soundscape.wav

      - name: Upload Metal capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natureview-media
          path: |
            build/metal-scene.ppm
            build/metal-night.ppm
            build/nature-soundscape.wav
          if-no-files-found: warn
